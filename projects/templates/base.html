{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Patrick Eguaoba{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

  <header class="bg-white shadow sticky top-0 z-50">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="/" class="font-bold text-xl">Patrick<span class="text-blue-600">.</span></a>
      <div class="flex gap-4 items-center">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/services/">Services</a>
        <a href="/contact/" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center py-10 text-gray-500 text-sm">
    © 2026 Patrick Eguaoba - Ogu, Edo State. Built with Django + Tailwind.
  </footer>

</body>
</html>
