{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick Eguaoba - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .project-card { transition: all 0.3s ease; }
        .project-card:hover { transform: translateY(-8px); }
    </style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-white transition" x-data="{ dark: false, filter: 'all', modal: null }" :class="dark ? 'dark' : ''">
    <nav class="max-w-6xl mx-auto flex justify-between items-center p-6">
        <a href="/" class="text-2xl font-black">PE<span class="text-blue-600">.</span></a>
        <div class="flex gap-4 items-center">
            <a href="#projects" class="hidden md:block">Projects</a>
            <a href="#skills" class="hidden md:block">Skills</a>
            <a href="#contact" class="hidden md:block">Contact</a>
            <button @click="dark = !dark; document.documentElement.classList.toggle('dark')" class="bg-gray-200 dark:bg-gray-800 px-3 py-1 rounded-full text-sm">🌙 / ☀️</button>
        </div>
    </nav>
    {% block content %}{% endblock %}
    <footer class="text-center py-10 text-gray-500 text-sm">© 2026 Patrick Eguaoba - Ogute, Edo State. Built with Django + Tailwind.</footer>
</body>
</html>
